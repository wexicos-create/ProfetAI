name: Build Yisus AI Android APK

on:
  push:
    branches:
      - yisusai-native-android-build
    paths:
      - 'YisusAI-Native-Android/**'
      - '.github/workflows/yisusai-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YisusAI-Native-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and sign debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YisusAI-debug-signed-apk
          path: |
            YisusAI-Native-Android/app/build/outputs/apk/debug/app-debug.apk
            YisusAI-Native-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yisusai-android-build-${{ github.run_number }}
          name: Yisus AI Android APK build ${{ github.run_number }}
          body: |
            APK generado con Gradle y verificado con apksigner en GitHub Actions.
            Este artefacto usa la clave de depuración del runner; es para pruebas, no una firma de publicación permanente.
          files: |
            YisusAI-Native-Android/app/build/outputs/apk/debug/app-debug.apk
            YisusAI-Native-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          fail_on_unmatched_files: true