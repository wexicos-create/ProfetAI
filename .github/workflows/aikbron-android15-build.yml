name: Build aiKBron Android 15 signed APK
on:
  push:
    branches: ["build/aikbron-android15-icon"]
    paths:
      - "aikbron-android15/**"
      - ".github/workflows/aikbron-android15-build.yml"
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aikbron-android15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK API 35 and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: aiKBron-PRO-Android15-debug-signed-APK
          path: aikbron-android15/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
