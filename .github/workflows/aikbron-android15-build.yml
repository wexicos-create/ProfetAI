name: Build aiKBron Android 15 signed APK
on:
  push:
    branches: ["build/aikbron-android15-icon"]
    paths:
      - "aikbron-android15/**"
      - ".github/workflows/aikbron-android15-build.yml"
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aikbron-android15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK API 35 and build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" || true
          ls "$ANDROID_HOME/build-tools/" || true
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Restore verified aiKBron offline Android sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, io, tarfile
          data=base64.b64decode(Path('ci_source_payload.b64').read_text().strip(),validate=True)
          archive=lzma.decompress(data)
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as tar:
              for member in tar:
                  path=Path(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts: raise RuntimeError('Unsafe file path')
                  dst=Path.cwd()/path
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  with tar.extractfile(member) as src:
                      dst.write_bytes(src.read())
          print('aiKBron PRO 1.4 offline UI restored')
          PY
      - name: Fix Java WebChrome callback import
        run: sed -i '/import android.webkit.WebChromeClient;/a import android.webkit.ValueCallback;' app/src/main/java/com/caenterprise/aikbron/RemoteActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: aiKBron-PRO-Android15-debug-signed-APK
          path: aikbron-android15/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
